[package]
name = "skript-docs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed model, runtime fetch and cache for Skript's published docs.json"

[dependencies]
skript-syntax = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# rustls on ring with the bundled webpki roots: no OpenSSL/native-tls, so the
# musl release targets cross-build with cargo-zigbuild, and no aws-lc-rs, which
# would need cmake and a C toolchain per target.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
skript-syntax = { workspace = true }
