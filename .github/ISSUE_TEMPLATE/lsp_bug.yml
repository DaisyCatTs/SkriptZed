name: Completion, hover or diagnostics are wrong
description: The language server gives a wrong or missing answer
labels: ["bug", "lsp"]
body:
  - type: textarea
    id: line
    attributes:
      label: The line in question
      render: sk
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what you got
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Language server log
      description: |
        Zed command palette → `dev: open language server logs` → Skript.
        The first few lines say which syntax database loaded and which addons
        were detected, which resolves most of these immediately.
      render: shell
    validations:
      required: true
  - type: input
    id: skript
    attributes:
      label: Skript version on your server
  - type: input
    id: addons
    attributes:
      label: Addons installed
      description: e.g. SkBee 3.5.2, skript-reflect 2.5
