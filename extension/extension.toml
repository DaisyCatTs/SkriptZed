id = "skript"
name = "Skript"
version = "0.2.1"
schema_version = 1
description = "Skript language support for Minecraft servers — syntax highlighting, autocomplete, hover docs, diagnostics and go-to-definition for .sk files."
repository = "https://github.com/DaisyCatTs/SkriptZed"
authors = ["Daisy <https://github.com/DaisyCatTs>"]

snippets = ["./snippets/skript.json"]

# Zed resolves this by running
#   git remote add origin <repository>
#   git fetch --depth 1 origin <rev>
# so `rev` must name a commit that exists **on GitHub**, not just locally.
#
# For local grammar work, `node scripts/dev-setup.mjs` rewrites these two values
# to a `file://` URL and a fresh local commit. Do not commit that rewrite — the
# version checked in here is the one every user installs from.
[grammars.skript]
repository = "https://github.com/DaisyCatTs/SkriptZed"
rev = "e69b6ef39eb7b148f16f83d6f6bcee13b50f60b3"
path = "tree-sitter-skript"

[language_servers.skript-lsp]
name = "Skript Language Server"
languages = ["Skript"]

[language_servers.skript-lsp.language_ids]
Skript = "skript"

# Needed to fetch a release build of skript-lsp when the user has not installed
# one themselves. Zed gates this behind the user's granted capabilities.
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["DaisyCatTs", "SkriptZed", "**"]
