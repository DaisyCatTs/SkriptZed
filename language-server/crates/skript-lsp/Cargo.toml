[package]
name = "skript-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Language server for the Skript scripting language"

[[bin]]
name = "skript-lsp"
path = "src/main.rs"

[dependencies]
skript-addons = { workspace = true }
skript-docs = { workspace = true }
skript-index = { workspace = true }
skript-format = { workspace = true }
skript-syntax = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
