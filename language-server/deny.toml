# Licence gate for everything the language server ships with. The project is
# MIT and sold alongside proprietary products, so only permissive licences are
# allowed; anything copyleft fails CI here instead of being discovered later.
# Run: cargo deny check licenses

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
# The list is a policy, not an inventory of what is used today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    # webpki-roots: Mozilla's CA list, permissive data licence.
    "CDLA-Permissive-2.0",
]

[licenses.private]
# The workspace's own crates are MIT but unpublished.
ignore = true
